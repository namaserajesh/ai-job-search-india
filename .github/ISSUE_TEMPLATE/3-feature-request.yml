name: Feature request
description: Suggest a new India check or an improvement to the pack.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What goes wrong in your job search today? Give a real example if you can, such as a listing the checks missed.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should the pack do? It never applies for you and never scrapes portals on a schedule.
    validations:
      required: true
