# Experienced professionals: skip internship and entry-level titles
# (career-ops' own seniority classifier decides the tier).
skip_tiers: [intern, entry]

title_filter:
  positive:
    - "Software Engineer"
    - "Software Developer"
    - "Software Development Engineer"
    - "word:SDE"
    - "Backend"
    - "Back End"
    - "Frontend"
    - "Front End"
    - "Full Stack"
    - "Fullstack"
    - "Java Developer"
    - "Python Developer"
    - ".NET Developer"
    - "Node"
    - "React"
    - "Angular"
    - "Mobile"
    - "Android"
    - "word:iOS"
    - "DevOps"
    - "word:SRE"
    - "Site Reliability"
    - "Cloud Engineer"
    - "Cloud Architect"
    - "Platform Engineer"
    - "Data Engineer"
    - "Data Scientist"
    - "Analytics Engineer"
    - "Machine Learning"
    - "word:ML"
    - "word:AI"
    - "word:QA"
    - "SDET"
    - "Test Engineer"
    - "Automation Engineer"
    - "Security Engineer"
    - "Software Architect"
    - "Solutions Architect"
    - "Technical Architect"
    - "Tech Lead"
    - "Technical Lead"
    - "Engineering Manager"
    - "Technical Product Manager"
    - "word:SAP"
    - "Salesforce Developer"
    - "Mainframe"
  negative:
    - "word:Intern"
    - "word:Interns"
    - "Internship"
    - "Trainee"
    - "Fresher"
    - "Campus"
    - "New Grad"
    - "Graduate"
    - "Apprentice"
    - "Recruiter"
    - "Business Develop"
    - "Account Executive"
    - "Sales"
    - "Marketing"
    - "Collection"
    - "word:GTM"
    - "Customer Success"
  seniority_boost:
    - "Senior"
    - "Lead"
    - "Staff"
    - "Principal"
    - "Architect"
    - "Manager"
