# Web-search discovery, run by the AI during /career-ops scan (costs tokens).
# Tested 2026-10-25: the web search ignored the site: filter and returned mostly
# 2021-era posts and aggregator pages, so every query is switched off. For
# Naukri, LinkedIn, Instahyre, Foundit etc., paste the job link (or the job
# description text, when LinkedIn hides it behind a login) into /career-ops.
search_queries:
  - name: Greenhouse and Lever - India fresher SDE
    query: 'site:boards.greenhouse.io OR site:jobs.lever.co ("Software Engineer" OR "SDE") ("fresher" OR "new grad" OR "0-1 years") India'
    enabled: false

  - name: Pune entry-level software roles
    query: '("Software Engineer" OR "Associate Software Engineer") ("fresher" OR "entry level" OR "2026 batch" OR "2027 batch") Pune'
    enabled: false

  - name: Naukri - fresher software engineer, Pune
    query: 'site:naukri.com/job-listings ("Software Engineer" OR "Software Developer" OR "SDE") ("fresher" OR "0-1" OR "0 to 1") Pune'
    enabled: false

  - name: LinkedIn - entry-level software engineer, Pune
    query: 'site:linkedin.com/jobs/view ("Software Engineer" OR "SDE") ("entry level" OR "fresher" OR "new grad" OR "graduate") Pune'
    enabled: false

  - name: Instahyre - fresher software roles
    query: 'site:instahyre.com/job ("Software Engineer" OR "Software Developer") ("fresher" OR "0-1 years") (Pune OR Bangalore OR Bengaluru)'
    enabled: false

  - name: Wellfound and Cutshort - startup SDE roles in India
    query: '(site:wellfound.com/jobs OR site:cutshort.io/job) ("Software Engineer" OR "SDE") ("fresher" OR "entry level" OR "0-1") (Pune OR Bangalore OR Bengaluru)'
    enabled: false

  - name: Foundit - fresher software engineer
    query: 'site:foundit.in/job ("Software Engineer" OR "Software Developer") ("fresher" OR "0-1 years") Pune'
    enabled: false

  - name: Internshala - software development internships and fresher jobs
    query: 'site:internshala.com ("software development" OR "web development" OR "backend") (internship OR "fresher job") Pune'
    enabled: false

tracked_companies:

  # -- Pune --
  - name: Druva
    careers_url: https://job-boards.greenhouse.io/druva
    api: https://boards-api.greenhouse.io/v1/boards/druva/jobs
    notes: "Data protection SaaS. Large Pune engineering office."
    enabled: true

  - name: PubMatic
    careers_url: https://job-boards.greenhouse.io/pubmatic
    api: https://boards-api.greenhouse.io/v1/boards/pubmatic/jobs
    notes: "Ad-tech. Pune is its biggest location by open roles."
    enabled: true

  - name: Mindtickle
    careers_url: https://jobs.lever.co/mindtickle
    notes: "Sales-enablement SaaS. Pune headquarters."
    enabled: true

  - name: Google
    careers_url: https://www.google.com/about/careers/applications/jobs/results/
    provider: google
    google:
      location: "India"
      queries: ["software engineer", "early career software"]
    notes: "Google's own careers site: newest ~20 postings per query (Google's robots.txt allows only the first results page). Also lists YouTube and other Alphabet roles."
    enabled: true

  # -- Big tech and global firms (India roles only, via location_filter) --
  # All tested 2026-10-25 with career-ops' own scanner; counts in notes are
  # fresher-fit India roles found that day (experienced counts are higher).
  # Atlassian (no India roles), JPMorgan, ServiceNow, Freshworks, Cadence and
  # Thoughtworks (0 fresher roles each) were tested and left out.
  - name: Microsoft
    careers_url: https://microsoft.eightfold.ai/careers?domain=microsoft.com
    provider: eightfold
    notes: "4 India roles on 2026-10-25. Large global board: the slowest company in the scan."
    enabled: true

  - name: Amazon
    careers_url: https://www.amazon.jobs/en/
    provider: amazon
    amazon:
      normalized_country_code: ["IND"]
      category: software-development
    notes: "62 India SDE roles on 2026-10-25, many SDE I. Shows Amazon's India company names (ADCI = Amazon Development Centre India)."
    enabled: true

  - name: NVIDIA
