# Web-search discovery, run by the AI during /career-ops scan (costs tokens).
# Tested 2026-10-25: the web search ignored the site: filter and returned mostly
# 2021-era posts and aggregator pages, so every query is switched off. For
# Naukri, LinkedIn, Instahyre, Foundit etc., paste the job link (or the job
# description text, when LinkedIn hides it behind a login) into /career-ops.
search_queries:
  - name: Greenhouse and Lever - India fresher SDE
    query: 'site:boards.greenhouse.io OR site:jobs.lever.co ("Software Engineer" OR "SDE") ("fresher" OR "new grad" OR "0-1 years") India'
    enabled: false

  - name: Pune entry-level software roles
    query: '("Software Engineer" OR "Associate Software Engineer") ("fresher" OR "entry level" OR "2026 batch" OR "2027 batch") Pune'
    enabled: false

  - name: Naukri - fresher software engineer, Pune
    query: 'site:naukri.com/job-listings ("Software Engineer" OR "Software Developer" OR "SDE") ("fresher" OR "0-1" OR "0 to 1") Pune'
    enabled: false

  - name: LinkedIn - entry-level software engineer, Pune
    query: 'site:linkedin.com/jobs/view ("Software Engineer" OR "SDE") ("entry level" OR "fresher" OR "new grad" OR "graduate") Pune'
    enabled: false

  - name: Instahyre - fresher software roles
    query: 'site:instahyre.com/job ("Software Engineer" OR "Software Developer") ("fresher" OR "0-1 years") (Pune OR Bangalore OR Bengaluru)'
    enabled: false

  - name: Wellfound and Cutshort - startup SDE roles in India
    query: '(site:wellfound.com/jobs OR site:cutshort.io/job) ("Software Engineer" OR "SDE") ("fresher" OR "entry level" OR "0-1") (Pune OR Bangalore OR Bengaluru)'
    enabled: false

  - name: Foundit - fresher software engineer
    query: 'site:foundit.in/job ("Software Engineer" OR "Software Developer") ("fresher" OR "0-1 years") Pune'
    enabled: false

  - name: Internshala - software development internships and fresher jobs
    query: 'site:internshala.com ("software development" OR "web development" OR "backend") (internship OR "fresher job") Pune'
    enabled: false

tracked_companies:

